services:
  grok-bot-tools:
    image: python:3.13-alpine
    container_name: grok-bot-tools
    command: ["python3", "/app/server.py", "serve"]
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    volumes:
      - ./server.py:/app/server.py:ro
      - ./public:/app/public:ro
      - ./data:/data:rw
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - management-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  management-network:
    external: true
